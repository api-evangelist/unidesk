name: Unidesk
description: Unidesk was a Marlborough, Massachusetts software company backed by Matrix
  Partners that pioneered application layering for virtual desktop infrastructure,
  packaging Windows applications and operating-system components into shareable virtual
  disk layers. Citrix acquired Unidesk in January 2017 and the technology lives on
  as Citrix App Layering. unidesk.com now 301-redirects to the Citrix App Layering
  product page, the GitHub organization has been dormant since the acquisition, and
  the company maintains no standalone API surface of its own.
